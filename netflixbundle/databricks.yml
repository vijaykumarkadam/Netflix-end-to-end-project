# This is a Databricks asset bundle definition for netflixbundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: netflixbundle
  uuid: 1b80be12-94d0-45b3-86a0-7e0c9ad5d67e

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: adb-3565877398787521.1.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: adb-3565877398787521.1.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/databricksuser@kadamvijayrmgmail.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/databricksuser@kadamvijayrmgmail.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: admin
        level: CAN_MANAGE
